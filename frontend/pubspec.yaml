name: frontend
description: "GeoTaste AI - Food Recommendation App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
   

  # Location
  geolocator: ^12.0.0
  permission_handler: ^11.3.0

  # Notifications + background tasks
  flutter_local_notifications: ^17.0.0

  # Networking + state management
  http: ^1.2.0
  provider: ^6.1.0

  # Local storage
  shared_preferences: ^2.2.0

  # UI
  google_fonts: ^6.2.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true